name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build pull requests too (without deploying), so a broken build shows up
  # before it reaches main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; let an in-progress one finish.
# Pull request builds get their own group, and a newer push cancels an older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Drafts shared by link (npm run draft:share) come from the PRIVATE
      # blog-drafts repo through a read-only deploy key. Without the secret
      # (forks, Dependabot, or before it's set up) the site builds without them.
      HAS_DRAFTS_KEY: ${{ secrets.DRAFTS_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check out shared drafts
        if: env.HAS_DRAFTS_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: HuNtErJ1324/blog-drafts
          path: drafts
          ssh-key: ${{ secrets.DRAFTS_DEPLOY_KEY }}
          persist-credentials: false
      # This repo's Actions logs are public, and the build log and the
      # artifact upload list every page: mask the share tokens in them.
      - name: Mask share tokens
        if: env.HAS_DRAFTS_KEY == 'true'
        run: >-
          node --input-type=module -e "import { sharedDrafts } from './scripts/shared-drafts.mjs';
          for (const { token } of sharedDrafts()) console.log('::add-mask::' + token);"
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          # The restored content cache would keep serving deleted posts.
          cache: false

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
